# Blocks merges when of-record / full-app / typecheck gates fail.
# Keep in lockstep with scripts/precommit-gate.js (single source of gate steps).
name: Pre-commit gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sanity — Jest config must not require ts-node
        run: |
          if [ -f jest.config.ts ] && [ ! -f jest.config.js ] && [ ! -f jest.config.mjs ] && [ ! -f jest.config.cjs ]; then
            echo "::error::jest.config.ts alone needs ts-node; use jest.config.js for CI"
            exit 1
          fi
          if [ -f jest.config.ts ]; then
            echo "::warning::Remove jest.config.ts — prefer jest.config.js only"
          fi
          test -f jest.config.js || test -f jest.config.mjs || test -f jest.config.cjs

      - name: Pre-commit capability gate (tsc + fullApp + of-record + inventory)
        run: npm run test:precommit

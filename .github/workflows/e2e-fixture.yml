# Required loop proof: north-star fixture e2e (deterministic stubs — no live free-API flakiness).
# Complements precommit unit gate; full-app live surface stays on e2e-nightly.yml.
name: E2E fixture (north-star)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-fixture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  north-star-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: North-star fixture e2e (rank → pack → RH + data-hub + AI view)
        env:
          E2E_FIXTURE: '1'
          E2E_WEBSERVER: '1'
          CI: '1'
        run: npm run test:e2e:fixture

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fixture
          path: playwright-report/
          retention-days: 7

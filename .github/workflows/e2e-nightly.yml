# Nightly full-app surface tour (live free APIs — may flake on upstream outages).
name: E2E full-app (nightly)

on:
  schedule:
    # 06:15 UTC daily
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  full-app-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start Next.js and run full-app e2e
        env:
          E2E_WEBSERVER: '1'
          CI: '1'
        run: npm run test:e2e:full-app

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full-app
          path: playwright-report/
          retention-days: 7
